<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>roverflow</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap");

      body {
        font-family: "Orbitron", monospace;
        background: #000;
        overflow-x: hidden;
      }

      .pixel-grid {
        background-image: linear-gradient(
            rgba(0, 38, 255, 0.1) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(0, 81, 255, 0.1) 1px, transparent 1px);
        background-size: 20px 20px;
        animation: gridMove 20s linear infinite;
      }

      @media (max-width: 768px) {
        .text-8xl {
          font-size: 3rem;
        }
        .text-2xl {
          font-size: 1.25rem;
        }
      }
    </style>
  </head>

  <body
    class="bg-black text-green-400 min-h-screen flex items-center justify-center relative pixel-grid"
  >
    <div class="matrix-rain" id="matrixRain"></div>
    <div class="relative z-10 text-center px-4 max-w-4xl mx-auto">
      <div class="mb-8">
        <h1
          class="text-8xl font-black text-blue-400 glitch mb-4 tracking-wider"
        >
          In Progess
        </h1>
      </div>
    </div>
  </body>
</html>
